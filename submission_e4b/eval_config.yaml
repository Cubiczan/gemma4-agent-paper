# Per-task budgets. ~120 hidden tasks run sequentially under a hard 12 h cap (inclusive of
# sandbox setup). 3.5 min agent time + ~1.5-2 min harness overhead keeps us near 10-11 h.
# timeout_seconds also bounds verification pytest, so keep it >= 180.
evaluation:
  timeout_seconds: 180
  max_tool_calls: 40
  max_time_minutes: 3.5
  max_turns: 80
